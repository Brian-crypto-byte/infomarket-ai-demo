<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Positions - infomarket.ai</title>
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <script src="assets/i18n.js"></script>
  <script src="assets/page-shell.js"></script>
  <script>document.write(appHeader('Positions'));</script>

  <main class="app-shell">
    <a class="back-link" href="dashboard.html">Back to dashboard</a>
    <div class="page-head">
      <div>
        <h1 data-i18n="positions.title">Positions</h1>
        <div class="sub" data-i18n="positions.subtitle">Track football YES/NO, correct-score fixed-odds positions, crypto Up/Down trades, potential returns, and insurance cover.</div>
      </div>
      <button class="btn primary" onclick="location.href='index.html'">Continue trading</button>
    </div>

    <section class="cards" data-position-cards>
      <div class="card"><span>Total staked</span><strong data-total-staked>0</strong></div>
      <div class="card"><span>Potential return</span><strong class="green" data-total-return>0</strong></div>
      <div class="card"><span>Insured amount</span><strong data-total-insured>0</strong></div>
      <div class="card"><span>Lobster Token</span><strong class="green" data-total-credits>0</strong></div>
    </section>

    <section class="panel">
      <div class="tabs" data-position-tabs><button class="tab active" data-status="Open">Open</button><button class="tab" data-status="Settled">Settled</button><button class="tab" data-status="Insured">Insured</button></div>
      <table class="table" data-dynamic-positions>
        <thead><tr><th>Market</th><th>Pick</th><th>Amount</th><th>Potential return</th><th>Lobster Token</th><th>Insurance</th><th>Rule</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="assets/api-client.js?v=football-refresh1"></script>
  <script src="assets/web-store.js"></script>
  <script src="assets/web-positions.js"></script>
  <script src="assets/brand-ui.js"></script>
  <script src="assets/web-shell.js"></script>
</body>
</html>
