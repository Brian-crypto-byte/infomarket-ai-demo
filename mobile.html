<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>infomarket.ai H5</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #fff;
      --text: #111827;
      --muted: #6b7280;
      --soft: #9ca3af;
      --line: #e5e7eb;
      --black: #050505;
      --green: #00a67e;
      --green-bg: #e9fbf6;
      --red: #d94b5f;
      --blue: #2563eb;
      --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.05);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); padding-bottom: 78px; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .phone { max-width: 430px; min-height: 100vh; margin: 0 auto; background: var(--bg); }
    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: rgba(255,255,255,.94); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line); padding: 12px 14px 10px;
    }
    .topline { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .logo { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: #050505; color: #fff; font-weight: 950; }
    .brand { font-weight: 900; font-size: 18px; flex: 1; }
    .login { height: 36px; border: 0; background: transparent; color: var(--blue); font-weight: 900; padding: 0 6px; }
    .register { height: 36px; border: 0; border-radius: 9px; background: var(--blue); color: #fff; font-weight: 900; padding: 0 13px; }
    .menu { width: 40px; height: 36px; border: 1px solid var(--line); border-radius: 9px; background: #f3f4f6; font-size: 22px; }
    .search { height: 42px; display: flex; align-items: center; gap: 10px; padding: 0 13px; border: 1px solid var(--line); border-radius: 11px; background: #f8fafc; color: var(--soft); }
    .search input { width: 100%; border: 0; outline: 0; background: transparent; }
    .cats { display: flex; gap: 8px; overflow-x: auto; padding: 13px 14px 6px; }
    .chip { height: 34px; border: 1px solid var(--line); border-radius: 999px; background: #fff; padding: 0 14px; font-weight: 850; white-space: nowrap; }
    .chip.active { background: #050505; border-color: #050505; color: #fff; }
    .section-title { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px 10px; }
    .section-title h1 { margin: 0; font-size: 22px; }
    .section-title a { color: var(--blue); text-decoration: none; font-size: 13px; font-weight: 850; }
    .list { display: grid; gap: 12px; padding: 0 12px 18px; }
    .market { border: 1px solid var(--line); border-radius: 16px; background: #fff; box-shadow: var(--shadow); overflow: hidden; cursor: pointer; }
    .head { display: flex; align-items: center; gap: 11px; padding: 13px; border-bottom: 1px solid #eef0f3; }
    .league { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 950; background: linear-gradient(145deg,#e11d48,#2563eb); flex: 0 0 auto; }
    .title { min-width: 0; flex: 1; }
    .title h2 { margin: 0; font-size: 17px; line-height: 1.25; }
    .title p { margin: 4px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .live { height: 27px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center; background: var(--green-bg); color: var(--green); font-size: 12px; font-weight: 900; }
    .teams { margin: 12px; border: 1px solid #eef0f3; border-radius: 14px; background: #fbfcfd; display: grid; grid-template-columns: 1fr 48px 1fr; align-items: center; padding: 12px 10px; }
    .team { display: grid; justify-items: center; gap: 7px; min-width: 0; }
    .team-logo { width: 48px; height: 48px; border-radius: 13px; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 950; }
    .red { background: linear-gradient(145deg,#e11d48,#f59e0b); }
    .purple { background: linear-gradient(145deg,#6d28d9,#1e3a8a); }
    .blue { background: linear-gradient(145deg,#0284c7,#f97316); }
    .navy { background: linear-gradient(145deg,#1e3a8a,#0891b2); }
    .team span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 900; font-size: 13px; }
    .vs { text-align: center; color: var(--soft); font-weight: 900; }
    .vs small { display: block; margin-top: 3px; font-size: 10px; }
    .odds { display: grid; gap: 8px; padding: 0 12px 12px; }
    .row3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
    .row2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
    .odd { min-height: 46px; border: 1px solid var(--line); border-radius: 11px; background: #fff; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; font-weight: 900; }
    .odd span { color: #4b5563; font-size: 13px; }
    .score { min-height: 60px; display: grid; gap: 2px; }
    .score div { display: flex; justify-content: space-between; gap: 8px; }
    .yes { color: var(--green); } .no { color: var(--red); }
    .bottom-nav { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: min(430px,100%); height: 66px; border-top: 1px solid var(--line); background: rgba(255,255,255,.96); display: grid; grid-template-columns: repeat(5,1fr); align-items: center; z-index: 30; }
    .navitem { border: 0; background: transparent; display: grid; justify-items: center; gap: 3px; color: var(--muted); font-size: 11px; font-weight: 850; }
    .navitem i { font-style: normal; font-size: 20px; } .navitem.active { color: #050505; }
  </style>
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <div class="topline">
        <div class="logo">i</div><div class="brand">infomarket.ai</div>
        <button class="login">Login</button><button class="register">Sign up</button><button class="menu">鈽?/button>
      </div>
      <div class="search"><span>鈱?/span><input placeholder="Search markets" /></div>
    </header>
    <nav class="cats"><button class="chip active">Trending</button><button class="chip">Football</button><button class="chip">Crypto</button><button class="chip">AI</button><button class="chip">Sports</button></nav>
    <div class="section-title"><h1>Top Markets</h1><a href="#">View all</a></div>
    <section class="list">
      <article class="market" data-href="match.html?market=seoul-anyang">
        <div class="head"><div class="league">K</div><div class="title"><h2>Seoul vs Anyang</h2><p>K League ? 318,420 USDT volume</p></div><span class="live">Live</span></div>
        <div class="teams"><div class="team"><div class="team-logo red">SEO</div><span>Seoul</span></div><div class="vs">VS<small>Pending</small></div><div class="team"><div class="team-logo purple">ANY</div><span>Anyang</span></div></div>
        <div class="odds"><div class="row3"><button class="odd"><span>Home</span><strong>@1.700</strong></button><button class="odd"><span>Draw</span><strong>@3.500</strong></button><button class="odd"><span>Away</span><strong>@4.750</strong></button></div><div class="row2"><button class="odd score"><div><span>1-0</span><strong class="yes">@6.000</strong></div><div><span>No</span><strong class="no">@1.087</strong></div></button><button class="odd score"><div><span>0-1</span><strong class="yes">@11.010</strong></div><div><span>No</span><strong class="no">@1.048</strong></div></button></div></div>
      </article>
      <article class="market" data-href="match.html?market=national-noida">
        <div class="head"><div class="league">PL</div><div class="title"><h2>National Union vs Noida City</h2><p>Premier League ? 96,115 USDT volume</p></div><span class="live">Live</span></div>
        <div class="teams"><div class="team"><div class="team-logo blue">NU</div><span>National</span></div><div class="vs">VS<small>Pending</small></div><div class="team"><div class="team-logo navy">NC</div><span>Noida</span></div></div>
        <div class="odds"><div class="row3"><button class="odd"><span>Home</span><strong>@2.120</strong></button><button class="odd"><span>Draw</span><strong>@3.240</strong></button><button class="odd"><span>Away</span><strong>@3.180</strong></button></div><div class="row2"><button class="odd score"><div><span>2-1</span><strong class="yes">@8.200</strong></div><div><span>No</span><strong class="no">@1.062</strong></div></button><button class="odd score"><div><span>1-1</span><strong class="yes">@5.400</strong></div><div><span>No</span><strong class="no">@1.116</strong></div></button></div></div>
      </article>
    </section>
  </div>
  <nav class="bottom-nav"><button class="navitem active"><i>?</i>Main</button><button class="navitem"><i>?</i>Markets</button><button class="navitem"><i>?</i>Trade</button><button class="navitem"><i>?</i>Activity</button><button class="navitem"><i>?</i>My</button></nav>
  <script src="assets/i18n.js"></script>
  <script>
    document.querySelectorAll('.market[data-href]').forEach((card) => {
      card.addEventListener('click', () => { window.location.href = card.dataset.href; });
    });
  </script>
</body>
</html>
