        tag: 'Launch keynote website', desc: 'Apple 鍙戝竷浼氬紡鑺傚锛氬皯鏂囧瓧銆佸ぇ鐣欑櫧銆侀€愬睆瑙ｉ噴浜ゆ槗銆佹瘮鍒嗐€佷繚闄┿€侀噾搴撱€?,
        layout: 'video', radius: '24px', hero: 'linear-gradient(135deg,#f8fafc,#e9f4ef)'
      },
      {
        skill: 'web-video-presentation', title: 'VIDEO 03 / 鏂版墜鏁欒偛鍔ㄧ嚎', theme: 'cream',
        tag: 'Onboarding story flow', desc: '鎶娾€滃厖鍊?涓嬪崟-涔颁繚闄?缁撶畻-棰嗗彇濂栧姳鈥濆仛鎴愯繛缁晠浜嬶紝鏇撮€傚悎 Web/H5 鏂扮敤鎴疯浆鍖栥€?,
        layout: 'onboard', radius: '18px'
      }
    ];

    const groups = [...new Set(concepts.map((item) => item.skill))];
    let activeIndex = 0;

    function matchBlock() {
      return `
        <div class="match">
          <div>
            <div class="meta"><span class="league">EPL</span><span class="red">瀹炴椂</span><strong>EPL / 2H - 90</strong><span>$6.45M 浜ゆ槗閲?/span></div>
            <div class="team"><span class="scorebox">3</span><span class="crest">MU</span><strong>Man Utd</strong><span>18-11-7</span></div>
            <div class="team"><span class="scorebox">2</span><span class="crest blue">NF</span><strong>Forest</strong><span>11-10-15</span></div>
          </div>
          <div class="odds">
            <div class="result-row"><div class="quote">MUN <span class="green">@1.090</span></div><div class="quote">Draw <span class="green">@10.300</span></div><div class="quote">NFO <span class="green">@500.000</span></div></div>
            <div class="score-row"><div class="score"><b>0-0</b><span class="green">Y 5.20</span><span class="red">N 1.03</span></div><div class="score"><b>1-0</b><span class="green">Y 6.55</span><span class="red">N 1.04</span></div><div class="score"><b>2-1</b><span class="green">Y 9.42</span><span class="red">N 1.05</span></div><div class="quote">More</div></div>
          </div>
        </div>
      `;
    }

    function secondMatch() {
      return `
        <div class="match">
          <div>
            <div class="meta"><span class="league">SA</span><span class="red">瀹炴椂</span><strong>Serie A / 1H - 21</strong><span>$364.42K 浜ゆ槗閲?/span></div>
            <div class="team"><span class="scorebox">0</span><span class="crest blue">INT</span><strong>Inter Milan</strong><span>27-4-5</span></div>
            <div class="team"><span class="scorebox">0</span><span class="crest gold">VER</span><strong>Verona</strong><span>3-11-22</span></div>
          </div>
          <div class="odds">
            <div class="result-row"><div class="quote">INT <span class="green">@1.450</span></div><div class="quote">Draw <span class="green">@4.350</span></div><div class="quote">VER <span class="green">@9.090</span></div></div>
            <div class="score-row"><div class="score"><b>0-0</b><span class="green">Y 5.20</span><span class="red">N 1.03</span></div><div class="score"><b>1-1</b><span class="green">Y 8.07</span><span class="red">N 1.04</span></div><div class="score"><b>2-0</b><span class="green">Y 7.90</span><span class="red">N 1.04</span></div><div class="quote">More</div></div>
          </div>
        </div>
      `;
    }

    function heroVisual() {
      return `
        <div class="hero-visual">
          <div class="hero-team"><span class="hero-crest">MU</span><strong>Man Utd</strong></div>
          <div class="hero-score"><strong>3 : 2</strong><span>2H - 90</span></div>
          <div class="hero-team"><span class="hero-crest blue">NF</span><strong>Forest</strong></div>
        </div>
      `;
    }

    function sidePanel(type) {
      const title = type === 'slip' ? '浜ゆ槗鍗? : type === 'trust' ? '鍙俊绯荤粺' : '璐︽埛鎬昏';
      return `
        <aside class="panel">
          <h3>${title}</h3>
          <div class="slip-row"><span>鍙敤浣欓</span><strong>12,480 USDT</strong></div>
          <div class="slip-row"><span>INF Credits</span><strong class="green">8,416.2</strong></div>
          <div class="slip-row"><span>Alpha 淇濋櫓</span><strong>鏈€楂?40%</strong></div>
          <div class="slip-row"><span>閲戝簱 APR</span><strong>12.4%</strong></div>
        </aside>
      `;
    }

    function renderBody(concept) {
      if (concept.layout === 'hero' || concept.layout === 'sports') {
        return `
          ${heroVisual()}
          <div class="market-board">
            <div class="market-list">${matchBlock()}${secondMatch()}</div>
            ${sidePanel('slip')}
          </div>
        `;
      }
      if (concept.layout === 'asset') {
        return `
          <div class="stat-grid"><div class="stat"><span>鍙敤</span><strong>12,480</strong></div><div class="stat"><span>閲戝簱</span><strong>24,000</strong></div><div class="stat"><span>淇濋櫓璧斾粯</span><strong class="green">180</strong></div></div>
          <div class="market-board"><div class="market-list">${matchBlock()}${secondMatch()}</div>${sidePanel('asset')}</div>
        `;
      }
      if (concept.layout === 'cards') {
        return `
          <div class="stat-grid"><div class="stat"><span>Sports</span><strong>Football scores</strong></div><div class="stat"><span>Crypto</span><strong>Up / Down</strong></div><div class="stat"><span>INFO</span><strong>Vault + Insurance</strong></div></div>
          <div class="market-list">${matchBlock()}${secondMatch()}</div>
        `;
      }
      if (concept.layout === 'prompt') {
        return `
          <div class="market-board">
            <div>
              ${heroVisual()}
              <div class="prompt-card">Image prompt direction: clean fintech betting exchange homepage, Apple-level restraint, football match centerpiece, real-time score, YES/NO correct score market, USDT ledger, soft glass panels, no purple gradient, no emoji.</div>
            </div>
            ${sidePanel('slip')}
          </div>
        `;
      }
      if (concept.layout === 'infographic') {
        return `
          <div class="stat-grid"><div class="stat"><span>01 Trade</span><strong>USDT 涓嬪崟</strong></div><div class="stat"><span>02 Mine</span><strong>INF Credits</strong></div><div class="stat"><span>03 Protect</span><strong>Alpha 淇濋櫓</strong></div></div>
          <div class="market-board"><div class="panel"><h3>浜ゆ槗 鈫?鎸栫熆 鈫?閲戝簱/淇濋櫓 鈫?TVL 椋炶疆</h3><div class="slip-row"><span>浜ゆ槗閲戦</span><strong>缁戝畾 Credits</strong></div><div class="slip-row"><span>閲戝簱瀛樻</span><strong>鏀剁泭 + 鍔犳垚</strong></div><div class="slip-row"><span>浜忔崯淇濆崟</span><strong>璧斾粯鑺傜偣</strong></div></div>${sidePanel('asset')}</div>
        `;
      }
      if (concept.layout === 'kb' || concept.layout === 'trust' || concept.layout === 'map') {
        return `
          <div class="stat-grid"><div class="stat"><span>甯傚満</span><strong>浣撹偛 / 鍔犲瘑 / AI</strong></div><div class="stat"><span>璐︽湰</span><strong>available / frozen</strong></div><div class="stat"><span>缁撶畻</span><strong>閾句笅鎾悎</strong></div></div>
          <div class="market-board"><div class="market-list">${matchBlock()}${secondMatch()}</div>${sidePanel('trust')}</div>
        `;
      }
      if (concept.layout === 'video' || concept.layout === 'onboard') {
        return `
          <div class="video-frames">
            <div class="frame"><span class="shot-number">Scene 01</span><b>鐪熷疄浜嬩欢棰勬祴</b><span>鐢ㄦ埛鐪嬪埌鐒︾偣姣旇禌鍜屾牳蹇冭禂鐜囥€?/span></div>
            <div class="frame"><span class="shot-number">Scene 02</span><b>姣斿垎 YES / NO</b><span>0-0 鍒?4-4 鐨?25 涓瘮鍒嗭紝姣忎釜閮芥湁鍥哄畾璧旂巼銆?/span></div>
            <div class="frame"><span class="shot-number">Scene 03</span><b>浜ゆ槗椋炶疆</b><span>USDT 浜ゆ槗銆両NF Credits銆侀噾搴撱€佷繚闄╁舰鎴愮暀瀛樸€?/span></div>
          </div>
          <div style="height:14px"></div>
          <div class="market-board"><div class="market-list">${matchBlock()}</div>${sidePanel('slip')}</div>
        `;
      }
      return `<div class="market-list">${matchBlock()}${secondMatch()}</div>`;
    }

    function renderPreview(index) {
      activeIndex = index;
      const concept = concepts[index];
      const screen = document.getElementById('screen');
      screen.className = `screen ${concept.theme}`;
      screen.style.setProperty('--radius', concept.radius || '14px');
      screen.style.setProperty('--hero', concept.hero || 'linear-gradient(135deg,#20242a,#33433c)');
      screen.style.setProperty('--card', concept.theme === 'ink' ? 'rgba(255,255,255,.06)' : '#fff');
      screen.innerHTML = `
        <div class="preview-head">
          <div>
            <span class="skill-tag">${concept.skill}</span>
            <h2 class="preview-title">${concept.title}</h2>
            <p class="preview-desc">${concept.desc}</p>
            <div class="navline"><span>鐑棬</span><span>浣撹偛</span><span>鍔犲瘑</span><span>鐢电珵</span><span>INFO 閲戝簱</span><span>INFO 淇濋櫓</span></div>
          </div>
          <div class="logo-word"><img src="assets/logo.svg" alt="">infomarket.ai</div>
        </div>
        ${renderBody(concept)}
      `;
      document.getElementById('currentCount').textContent = `${String(index + 1).padStart(2, '0')} / ${concepts.length}`;
      document.querySelectorAll('[data-concept]').forEach((button) => button.classList.toggle('active', Number(button.dataset.concept) === index));
      document.querySelectorAll('[data-skill]').forEach((button) => button.classList.toggle('active', button.dataset.skill === concept.skill));
    }

    function renderNav() {
      const tabs = document.getElementById('skillTabs');
      tabs.innerHTML = groups.map((skill) => `<button data-skill="${skill}">${skill}</button>`).join('');
      tabs.querySelectorAll('[data-skill]').forEach((button) => {
        button.addEventListener('click', () => renderPreview(concepts.findIndex((item) => item.skill === button.dataset.skill)));
      });

      const nav = document.getElementById('conceptNav');
      nav.innerHTML = groups.map((skill) => {
        const items = concepts.map((item, index) => ({ ...item, index })).filter((item) => item.skill === skill);
        return `
          <section class="group">
            <h2>${skill}</h2>
            ${items.map((item) => `<button data-concept="${item.index}"><strong>${item.title.split(' / ').slice(1).join(' / ') || item.title}</strong><span>${item.tag}</span></button>`).join('')}
          </section>
        `;
      }).join('');
      nav.querySelectorAll('[data-concept]').forEach((button) => {
        button.addEventListener('click', () => renderPreview(Number(button.dataset.concept)));
      });
    }

    renderNav();
    renderPreview(0);
  </script>
</body>
</html>
